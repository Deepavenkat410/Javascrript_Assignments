<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> 1. Check whether a number is divisible by 3 and 5</h1>
    <script>
     let num=prompt('Enter the number')
     if(num % 3==0 && num%5==0){
           alert('Divisible by 3 and 5 ');
           
     }
      else if(num%3==0){
         alert('Divisible by  3');
      }
     else if(num%5==0){
         alert('Divisible by  5');
     }
     else{
           alert('Not Divisible by 3 and 5');
     }
    </script>
</body>
</html>
