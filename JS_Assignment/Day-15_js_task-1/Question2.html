<body>
    <h1>Find the datatype of five different variables using typeof.</h1>
    <script>
      let a= 10;
      let b="sun";
      let c=4.5
      let d=true;
      let e;
      console.log(typeof(a),a)
      console.log(typeof(b),b)
      console.log(typeof(c),c)
      console.log(typeof(d),d)
      console.log(typeof(e),e)
    </script>
