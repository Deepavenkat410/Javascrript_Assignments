<body>
    <p>Write a function that reverses a given string.</p>
</body>
<script>

    function reverse(string){
       let rev="";
     for(let i=string.length-1; i>=0; i--) {
        rev= rev + string[i];
     }
     return rev;
    }
    console.log((reverse("Computer")))
</script>
