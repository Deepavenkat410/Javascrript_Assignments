<body>
    <p>Write a function checkEvenOdd(num) that checks whether a given number is even or odd.</p>
</body>
<script>
    function checkEvenOdd(num){
        if(num%2==0){
            console.log('The num is Even')
        }
        else{
            console.log('The num is Odd')
        }
    }
    checkEvenOdd(45);
</script>
