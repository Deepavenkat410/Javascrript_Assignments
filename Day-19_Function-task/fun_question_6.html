<body>
    <p>Write a function countVowels(str)
         that counts the number of vowels in a given string.</p>
</body>
<script>

    function countVowels(str){
      let count=0;
      for (let i = 0; i < str.length; i++) { 
        if(str[i]=='a'||str[i]=='e'|| str[i]=='i'|| str[i]=='o'|| str[i]=='u'){
        count++
      }
    }
     
     return count;
    }
    console.log('The Vowel Count is',countVowels("education"))
   
</script>
