<body>
    <p>Write a function factorial(num) 
        that calculates the factorial of a given number.</p>
</body>
<script>
    function factorial(num){
        fact=1
        for(let i=1;i<=num;i++){
            fact=fact*i
             
        }
       return fact;
    }
    console.log(factorial(3))
</script>
