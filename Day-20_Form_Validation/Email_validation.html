<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="abc.php" name="myform" method="post" onsubmit="return emailsubmit()">
    <label for="">Email:</label>
    <input type="email" name="Email">

    <br><br>
    <input type="submit" value="submit">
    </form>
</body>
<script>

    function emailsubmit(){
        let Email=document.myform.Email.value;
        if(Email===''){
            alert(' email  empty')
            return false;
        }

        if(!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/).test(Email)){
            alert('invalid email')
            return false;

        }
  return true;

  
    }
</script>
</html>
