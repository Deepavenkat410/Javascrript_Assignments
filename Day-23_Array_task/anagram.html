<script>
    function anagram(str1, str2) {

    let a = str1.split("").sort().join("");
    let b = str2.split("").sort().join("");

    if (a === b) {
        return "Anagram";
    } else {
        return "Not Anagram";
    }
}

console.log(anagram("listen", "silent"));
console.log(anagram("add", "app"));
