<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <p>Iterate an array using for loop, break and continue</p>   
</body>
<script>
    let arr = [1, 2, 3, 4, 5, 6];

for (let i = 0; i < arr.length; i++) {

    if (arr[i] === 4) {
        break;
    }

    console.log(arr[i]);
}

let num = [1, 2, 3, 4, 5, 6];

for (let i = 0; i < num.length; i++) {

    if (num[i] === 4) {
        continue;
    }

    console.log(arr[i]);
}
</script>

</html>
