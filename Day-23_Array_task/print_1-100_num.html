<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Print 1–100 and stop using break, then print 101</p>

</body>
<script>
    for (let i = 1; i <= 100; i++) {

    if (i === 100) {
        console.log(i);
        break;
    }

    console.log(i);
}

console.log(101);
</script>
</html>
