<body>
    <h3>Palindrome</h3>
</body>
<script>
function Palindrome(str){
let word="";
for(let i=str.length-1; i>=0; i--){
    word+=str[i];
}
if(str===word){
    return "palindrome";
}
else{
    return "Not a Palindrome";
}
}

console.log(Palindrome('madam'))



</script>
